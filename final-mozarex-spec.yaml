name: mozarex
region: syd
services:
- name: web
  github:
    branch: master
    deploy_on_push: true
    repo: smohammadnikkhah-debug/Digital-Marketing
  http_port: 3000
  instance_count: 1
  instance_size_slug: basic-xxs
  routes:
  - path: /
  envs:
  - key: NODE_ENV
    value: production
  - key: PORT
    value: "3000"
  - key: SESSION_SECRET
    value: your_session_secret
  - key: SUPABASE_URL
    value: your_supabase_url
  - key: SUPABASE_ANON_KEY
    value: your_supabase_anon_key
  - key: SUPABASE_SERVICE_ROLE_KEY
    value: your_supabase_service_role_key
  - key: OPENAI_API_KEY
    value: your_openai_api_key
  - key: PAYPAL_ENVIRONMENT
    value: sandbox
  - key: PAYPAL_SANDBOX_CLIENT_ID
    value: your_paypal_sandbox_client_id
  - key: PAYPAL_SANDBOX_CLIENT_SECRET
    value: your_paypal_sandbox_client_secret
  - key: PAYPAL_SANDBOX_WEBHOOK_ID
    value: your_paypal_sandbox_webhook_id
  - key: PAYPAL_LIVE_CLIENT_ID
    value: your_paypal_live_client_id
  - key: PAYPAL_LIVE_CLIENT_SECRET
    value: your_paypal_live_client_secret
  - key: PAYPAL_LIVE_WEBHOOK_ID
    value: your_paypal_live_webhook_id
  - key: STOCKANALYSIS_API_URL
    value: http://stockanalysis-api:8000
  - key: PAYPAL_LIVE_PAYOUTS_ENABLED
    value: "false"
  - key: PAYPAL_LIVE_FIRST_PAYOUT_MAX_MINOR
    value: "1000"
- name: stockanalysis-api
  source_dir: stockanalysis/web_app/backend
  github:
    branch: master
    deploy_on_push: true
    repo: smohammadnikkhah-debug/Digital-Marketing
  environment_slug: python
  instance_count: 1
  instance_size_slug: basic-xxs
  internal_ports:
  - 8000
  run_command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  health_check:
    http_path: /api/health
    initial_delay_seconds: 15
    period_seconds: 30
    timeout_seconds: 5
    success_threshold: 1
    failure_threshold: 3
  envs:
  - key: PORT
    value: "8000"
  - key: PYTHON_VERSION
    value: "3.12"
  - key: SEC_USER_AGENT
    value: "MozarexPlatform/1.0 (info@mozarex.com)"
  - key: SECRET_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET

