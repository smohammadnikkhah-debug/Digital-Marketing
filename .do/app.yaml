name: digital-marketing-seo-analyzer
services:
- name: web
  source_dir: /
  github:
    repo: smohammadnikkhah-debug/Digital-Marketing
    branch: master
    deploy_on_push: true
  run_command: npm start
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: basic-xxs
  http_port: 3000
  routes:
  - path: /
  envs:
