name: digital-marketing-seo-analyzer
services:
- name: web
  source_dir: /
  github:
    repo: smohammadnikkhah-debug/Digital-Marketing
    branch: master
    deploy_on_push: false
  run_command: npm start
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: basic-xxs
  http_port: 3000
  routes:
  - path: /
  envs:
  - key: NODE_ENV
    value: production
  - key: PORT
    value: "3000"
  - key: STOCKANALYSIS_API_URL
    value: http://stockanalysis-api:8000
  - key: STOCKANALYSIS_ADMIN_KEY
    scope: RUN_TIME
    type: SECRET
  - key: SUPABASE_URL
    value: https://nrunrjfmqczeowakjnjh.supabase.co
  - key: SUPABASE_ANON_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: SUPABASE_SERVICE_ROLE_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: OPENAI_API_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: STRIPE_SECRET_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: STRIPE_PUBLISHABLE_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: STRIPE_STARTER_MONTHLY_PRICE_ID
    value: price_1SB8IyBFUEdVmecWKH5suX6H
  - key: STRIPE_STARTER_YEARLY_PRICE_ID
    value: price_1S9k6kBFUEdVmecWiYNLbXia
  - key: STRIPE_PROFESSIONAL_MONTHLY_PRICE_ID
    value: price_1SB8gWBFUEdVmecWkHXlvki6
  - key: STRIPE_PROFESSIONAL_YEARLY_PRICE_ID
    value: price_1S9kCwBFUEdVmecWP4DTGzBy
  - key: AUTH0_DOMAIN
    value: https://login.mozarex.com
  - key: AUTH0_CLIENT_ID
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: AUTH0_CLIENT_SECRET
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: AUTH0_SESSION_SECRET
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: AUTH0_CALLBACK_URL
    value: https://mozarex.com/auth/callback
  - key: AUTH0_LOGOUT_URL
    value: https://mozarex.com
  - key: JWT_SECRET
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: SESSION_SECRET
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: DATAFORSEO_USERNAME
    value: mohammad.nikkhah@mozarex.com
  - key: DATAFORSEO_PASSWORD
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: DATAFORSEO_BASE_URL
    value: https://api.dataforseo.com/v3/
  - key: DATAFORSEO_ENVIRONMENT
    value: prod
  - key: ENABLE_SANDBOX_MODE
    value: "false"
  - key: ENABLE_DEMO_DATA
    value: "false"
  - key: ENABLE_MOCK_RESPONSES
    value: "false"
  - key: ENABLE_SOCIAL_CONNECTIONS
    value: "false"
  - key: RESEND_API_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: SENDGRID_API_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: POSTMARK_SERVER_TOKEN
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: BREVO_API_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: AIVEKAI_EMAIL_FROM
    value: notifications@mozarex.com
  - key: AIVEKAI_PARTNER_APPLICATION_ADMIN_EMAIL
    value: info@mozarex.com
- name: stockanalysis-api
  source_dir: stockanalysis/web_app/backend
  github:
    repo: smohammadnikkhah-debug/Digital-Marketing
    branch: master
    deploy_on_push: false
  environment_slug: python
  instance_count: 1
  instance_size_slug: basic-xxs
  internal_ports:
  - 8000
  run_command: python -m app.supervisor
  health_check:
    http_path: /api/health
    initial_delay_seconds: 15
    period_seconds: 30
    timeout_seconds: 5
    success_threshold: 1
    failure_threshold: 3
  envs:
  - key: PORT
    value: "8000"
  - key: PYTHON_VERSION
    value: "3.12"
  - key: SEC_USER_AGENT
    value: "MozarexPlatform/1.0 (info@mozarex.com)"
  - key: SECRET_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: STOCKANALYSIS_ADMIN_KEY
    scope: RUN_TIME
    type: SECRET
  - key: DATABASE_URL
    scope: RUN_TIME
    type: SECRET
  - key: DB_SCHEMA
    scope: RUN_TIME
    value: "stockanalysis"
  - key: SUPABASE_URL
    scope: RUN_TIME
    value: "https://nrunrjfmqczeowakjnjh.supabase.co"

