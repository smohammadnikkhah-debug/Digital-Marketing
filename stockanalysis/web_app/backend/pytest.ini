[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    safe_local: Pure unit / SQLite tests with no live broker or production database
    isolated_postgres: Requires an isolated disposable PostgreSQL instance (not production)
    live_alpaca_readonly: Live Alpaca paper API read-only calls; no order mutations
    prod_db: Production/shared Supabase access; requires explicit authorization
addopts = -ra
filterwarnings =
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning
    ignore:.*on_event is deprecated.*:DeprecationWarning
    ignore:.*websockets.legacy is deprecated.*:DeprecationWarning
    ignore:.*starlette.testclient.*:DeprecationWarning
