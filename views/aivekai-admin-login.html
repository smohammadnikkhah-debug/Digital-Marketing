<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AivekAI Admin - Secure Administrator Sign In</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #006B5C;
            --primary-dark: #004D42;
            --primary-light: #E6F4F1;
            --accent: #00C2A8;
            --text-dark: #121816;
            --text-muted: #5C6764;
            --bg-page: #0D1412;
            --card-bg: #151F1C;
            --white: #FFFFFF;
            --border: rgba(0, 194, 168, 0.18);
            --radius-lg: 20px;
            --radius-md: 10px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-page);
            color: #E2E8F0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 40px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .admin-badge {
            background: rgba(239, 68, 68, 0.18);
            color: #F87171;
            font-size: 0.72rem;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .brand-subtitle {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #94A3B8;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: #0A0F0E;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--white);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 194, 168, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: var(--accent);
            color: var(--primary-dark);
            transform: translateY(-1px);
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #FCA5A5;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 0.88rem;
            margin-bottom: 20px;
            display: none;
        }

        .security-notice {
            margin-top: 24px;
            text-align: center;
            font-size: 0.78rem;
            color: #64748B;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="brand-header">
            <div class="brand-title">
                <span>AivekAI</span>
                <span class="admin-badge">Admin</span>
            </div>
            <p class="brand-subtitle">Authorized personnel access only</p>
        </div>

        <div id="errorAlert" class="alert-error">Invalid username or password.</div>

        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
            <div class="form-group">
                <label for="usernameInput">Administrator Username</label>
                <input type="text" id="usernameInput" required autocomplete="username" autofocus placeholder="Enter admin username">
            </div>

            <div class="form-group">
                <label for="passwordInput">Password</label>
                <input type="password" id="passwordInput" required autocomplete="current-password" placeholder="••••••••••••">
            </div>

            <button type="submit" class="btn-submit" id="loginBtn">Authenticate &rarr;</button>
        </form>

        <div class="security-notice">
            🔒 Protected by multi-factor rate limiting & cryptographic session verification. Unauthorized access attempts are monitored and recorded.
        </div>
    </div>

    <script>
        async function handleAdminLogin(e) {
            e.preventDefault();
            const errorAlert = document.getElementById('errorAlert');
            const loginBtn = document.getElementById('loginBtn');
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value;

            errorAlert.style.display = 'none';
            loginBtn.disabled = true;
            loginBtn.textContent = 'Verifying credentials...';

            try {
                const response = await fetch('/api/aivekai/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-csrf-token': 'valid_csrf_token'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Redirect to Admin Portal
                    window.location.replace(data.redirect_url || '/aivekai/admin/partners');
                } else {
                    errorAlert.textContent = data.message || 'Invalid username or password.';
                    errorAlert.style.display = 'block';
                    document.getElementById('passwordInput').value = '';
                }
            } catch (err) {
                errorAlert.textContent = 'Connection error. Please try again.';
                errorAlert.style.display = 'block';
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Authenticate \u2192';
            }
        }
    </script>
</body>
</html>
