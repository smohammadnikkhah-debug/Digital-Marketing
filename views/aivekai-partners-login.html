<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AivekAI Partner Portal - Sign In</title>
    <meta name="description" content="Access your AivekAI Partner Dashboard. View commissions, referral links, and campaign performance.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #006B5C;
            --primary-dark: #004D42;
            --primary-light: #E6F4F1;
            --accent: #00C2A8;
            --text-dark: #121816;
            --text-muted: #5C6764;
            --bg-page: #F8FAF9;
            --white: #FFFFFF;
            --border: rgba(0, 107, 92, 0.15);
            --card-shadow: 0 12px 36px rgba(0, 107, 92, 0.08);
            --radius-lg: 20px;
            --radius-md: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .login-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 44px 36px;
            max-width: 440px;
            width: 100%;
            box-shadow: var(--card-shadow);
            text-align: center;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.3rem;
            color: var(--primary-dark);
            margin-bottom: 24px;
        }

        .brand-logo img {
            width: 42px;
            height: 42px;
            border-radius: 10px;
        }

        .login-card h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .login-card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 28px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.88rem;
            margin-bottom: 6px;
            color: var(--text-dark);
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text-dark);
            background: var(--white);
            transition: var(--transition);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 107, 92, 0.12);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: var(--radius-md);
            background: var(--primary);
            color: var(--white);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 107, 92, 0.25);
            transition: var(--transition);
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .alert-box {
            display: none;
            padding: 14px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            font-size: 0.9rem;
            text-align: left;
        }

        .alert-error {
            background: #FCE8E6;
            color: #C5221F;
            border: 1px solid #FAD2CF;
        }

        .login-footer {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .login-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <a href="/aivekai/partners" class="brand-logo">
            <img src="/images/aivekai-logo.png" alt="AivekAI Logo" onerror="this.src='/images/favicon.png';">
            <span>AivekAI Partners</span>
        </a>

        <h1>Partner Sign In</h1>
        <p>Sign in to view your commissions, campaign links, and payouts.</p>

        <div id="alertBox" class="alert-box"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Partner Email</label>
                <input type="email" id="email" name="email" placeholder="partner@yourdomain.com" required autocomplete="email" autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" id="loginBtn" class="btn-submit">Sign In to Dashboard</button>
        </form>

        <div class="login-footer">
            Don't have an approved account? <a href="/aivekai/partners/apply">Apply here</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const alertBox = document.getElementById('alertBox');
        const loginBtn = document.getElementById('loginBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginBtn.disabled = true;
            loginBtn.innerText = 'Signing in...';
            alertBox.style.display = 'none';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/aivekai/partners/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-csrf-token': 'valid_csrf_token'
                    },
                    body: JSON.stringify({ email, password })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    window.location.replace(result.redirect_url || '/aivekai/partners/dashboard');
                } else {
                    alertBox.className = 'alert-box alert-error';
                    alertBox.innerText = result.message || result.error || 'Invalid email or password.';
                    alertBox.style.display = 'block';
                    document.getElementById('password').value = '';
                    loginBtn.disabled = false;
                    loginBtn.innerText = 'Sign In to Dashboard';
                }
            } catch (err) {
                alertBox.className = 'alert-box alert-error';
                alertBox.innerText = 'Unable to connect. Please try again.';
                alertBox.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.innerText = 'Sign In to Dashboard';
            }
        });
    </script>
</body>
</html>
