<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AivekAI Admin - Reset Password</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #006B5C;
            --primary-dark: #004D42;
            --primary-light: #E6F4F1;
            --accent: #00C2A8;
            --text-dark: #121816;
            --text-muted: #5C6764;
            --bg-page: #0D1412;
            --card-bg: #151F1C;
            --white: #FFFFFF;
            --border: rgba(0, 194, 168, 0.18);
            --radius-lg: 20px;
            --radius-md: 10px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-page);
            color: #E2E8F0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 40px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .admin-badge {
            background: rgba(0, 194, 168, 0.18);
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid rgba(0, 194, 168, 0.3);
        }

        .brand-subtitle {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #94A3B8;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: #0A0F0E;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--white);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 194, 168, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: var(--accent);
            color: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #FCA5A5;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 0.88rem;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #6EE7B7;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 0.88rem;
            margin-bottom: 20px;
            display: none;
        }

        .rules-box {
            background: #0A0F0E;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            margin-bottom: 20px;
            font-size: 0.78rem;
            color: #94A3B8;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="brand-header">
            <div class="brand-title">
                <span>AivekAI</span>
                <span class="admin-badge">Admin</span>
            </div>
            <p class="brand-subtitle">Set your new administrator password</p>
        </div>

        <div id="errorAlert" class="alert-error"></div>
        <div id="successAlert" class="alert-success"></div>

        <div class="rules-box">
            <strong>Password Requirements:</strong><br>
            • Minimum 10 characters<br>
            • At least one uppercase (A-Z) & lowercase (a-z)<br>
            • At least one number (0-9) & special symbol (!@#$...)
        </div>

        <form id="resetPasswordForm" onsubmit="handleResetPassword(event)">
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" required autocomplete="new-password" placeholder="Enter new strong password" autofocus>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" required autocomplete="new-password" placeholder="Confirm new password">
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Set New Password &rarr;</button>
        </form>

        <div style="margin-top: 24px; text-align: center;">
            <a href="/aivekai/admin/login" style="font-size: 0.85rem; color: var(--accent); text-decoration: none; font-weight: 600;">&larr; Return to Sign In</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            const errBox = document.getElementById('errorAlert');
            errBox.textContent = 'Password reset token is missing or invalid. Please check the link in your email.';
            errBox.style.display = 'block';
            document.getElementById('submitBtn').disabled = true;
        }

        async function handleResetPassword(e) {
            e.preventDefault();
            const errorAlert = document.getElementById('errorAlert');
            const successAlert = document.getElementById('successAlert');
            const submitBtn = document.getElementById('submitBtn');
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            errorAlert.style.display = 'none';
            successAlert.style.display = 'none';

            if (!token) {
                errorAlert.textContent = 'Invalid or missing reset token.';
                errorAlert.style.display = 'block';
                return;
            }

            if (newPassword.length < 10) {
                errorAlert.textContent = 'New password must be at least 10 characters long.';
                errorAlert.style.display = 'block';
                return;
            }

            if (!/[A-Z]/.test(newPassword) || !/[a-z]/.test(newPassword) || !/[0-9]/.test(newPassword) || !/[!@#$%^&*()_+\-=[\]{};':"\\|,.<>/?~`]/.test(newPassword)) {
                errorAlert.textContent = 'Password must include uppercase, lowercase, number, and a special character.';
                errorAlert.style.display = 'block';
                return;
            }

            if (newPassword !== confirmPassword) {
                errorAlert.textContent = 'Passwords do not match.';
                errorAlert.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Updating Password...';

            try {
                const res = await fetch('/api/aivekai/admin/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-csrf-token': 'valid_csrf_token'
                    },
                    body: JSON.stringify({ token, newPassword, confirmPassword })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    successAlert.textContent = 'Your password has been reset successfully! Redirecting to login...';
                    successAlert.style.display = 'block';
                    document.getElementById('resetPasswordForm').style.display = 'none';
                    setTimeout(() => {
                        window.location.replace(data.redirect_url || '/aivekai/admin/login?reset=success');
                    }, 1500);
                } else {
                    errorAlert.textContent = data.message || 'Password reset failed. Link may be expired.';
                    errorAlert.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Set New Password \u2192';
                }
            } catch (err) {
                errorAlert.textContent = 'Network error. Please try again.';
                errorAlert.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Set New Password \u2192';
            }
        }
    </script>
</body>
</html>
