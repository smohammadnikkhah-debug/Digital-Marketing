name: mozarex
region: syd
services:
- name: web
  github:
    branch: master
    deploy_on_push: true
    repo: smohammadnikkhah-debug/Digital-Marketing
  http_port: 3000
  instance_count: 1
  instance_size_slug: basic-xxs
  routes:
  - path: /
  envs:
  - key: NODE_ENV
    value: production
  - key: PORT
    value: "3000"
  - key: SESSION_SECRET
    value: your_session_secret
  - key: SUPABASE_URL
    value: your_supabase_url
  - key: SUPABASE_ANON_KEY
    value: your_supabase_anon_key
  - key: SUPABASE_SERVICE_ROLE_KEY
    value: your_supabase_service_role_key
  - key: OPENAI_API_KEY
    value: your_openai_api_key
  - key: PAYPAL_ENVIRONMENT
    value: sandbox
  - key: PAYPAL_SANDBOX_CLIENT_ID
    value: your_paypal_sandbox_client_id
  - key: PAYPAL_SANDBOX_CLIENT_SECRET
    value: your_paypal_sandbox_client_secret
  - key: PAYPAL_SANDBOX_WEBHOOK_ID
    value: your_paypal_sandbox_webhook_id
  - key: PAYPAL_LIVE_CLIENT_ID
    value: your_paypal_live_client_id
  - key: PAYPAL_LIVE_CLIENT_SECRET
    value: your_paypal_live_client_secret
  - key: PAYPAL_LIVE_WEBHOOK_ID
    value: your_paypal_live_webhook_id
  - key: PAYPAL_LIVE_PAYOUTS_ENABLED
    value: "false"
  - key: PAYPAL_LIVE_FIRST_PAYOUT_MAX_MINOR
    value: "1000"
